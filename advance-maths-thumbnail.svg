<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0c29"/>
      <stop offset="50%" style="stop-color:#302b63"/>
      <stop offset="100%" style="stop-color:#24243e"/>
    </linearGradient>
    <linearGradient id="stripe1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFA500;stop-opacity:0.12"/>
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="640" height="360" fill="url(#bg)"/>

  <!-- Diagonal stripes -->
  <polygon points="420,-40 700,-40 700,480 500,480" fill="url(#stripe1)"/>
  <polygon points="520,-40 580,-40 640,480 580,480" fill="rgba(255,165,0,0.04)"/>

  <!-- Top bar background -->
  <rect x="0" y="0" width="640" height="46" fill="rgba(0,0,0,0.4)"/>

  <!-- Brand: Gopal Jee (SSE) -->
  <text x="20" y="18" font-family="Arial,sans-serif" font-size="13" font-weight="800" fill="#FFD700" letter-spacing="0.5">GOPAL JEE (SSE)</text>
  <text x="20" y="34" font-family="Arial,sans-serif" font-size="10" font-weight="600" fill="#cccccc" letter-spacing="1">INDIAN RAILWAYS</text>

  <!-- RRB NTPC 2025 tag -->
  <rect x="530" y="9" width="92" height="26" rx="4" fill="#e63946"/>
  <text x="576" y="27" font-family="Arial,sans-serif" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">RRB NTPC 2025</text>

  <!-- Decorative math symbols left -->
  <text x="22" y="105" font-family="Arial,sans-serif" font-size="28" font-weight="900" fill="rgba(255,255,255,0.18)">∠</text>
  <text x="22" y="145" font-family="Arial,sans-serif" font-size="28" font-weight="900" fill="rgba(255,255,255,0.18)">π</text>
  <text x="22" y="185" font-family="Arial,sans-serif" font-size="28" font-weight="900" fill="rgba(255,255,255,0.18)">∑</text>
  <text x="22" y="225" font-family="Arial,sans-serif" font-size="28" font-weight="900" fill="rgba(255,255,255,0.18)">√</text>

  <!-- Decorative math symbols right -->
  <text x="598" y="105" font-family="Arial,sans-serif" font-size="28" font-weight="900" fill="rgba(255,255,255,0.18)">∫</text>
  <text x="598" y="145" font-family="Arial,sans-serif" font-size="28" font-weight="900" fill="rgba(255,255,255,0.18)">△</text>
  <text x="598" y="185" font-family="Arial,sans-serif" font-size="28" font-weight="900" fill="rgba(255,255,255,0.18)">⊕</text>
  <text x="598" y="225" font-family="Arial,sans-serif" font-size="28" font-weight="900" fill="rgba(255,255,255,0.18)">∞</text>

  <!-- Geometry SVG decoration (bottom-right) -->
  <g transform="translate(450, 130)" opacity="0.13">
    <polygon points="80,10 150,130 10,130" stroke="white" stroke-width="2.5" fill="none"/>
    <circle cx="80" cy="80" r="50" stroke="white" stroke-width="2" fill="none"/>
    <line x1="30" y1="80" x2="130" y2="80" stroke="white" stroke-width="1.5"/>
    <line x1="80" y1="10" x2="80" y2="130" stroke="white" stroke-width="1.5"/>
    <circle cx="80" cy="80" r="4" fill="white"/>
  </g>

  <!-- "MATHEMATICS" label -->
  <text x="320" y="108" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#FFD700" text-anchor="middle" letter-spacing="4">MATHEMATICS</text>

  <!-- Main title: ADVANCE -->
  <text x="320" y="178" font-family="Arial Black,Arial,sans-serif" font-size="68" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="-1">ADVANCE</text>

  <!-- Main title: MATHS (gold) -->
  <text x="320" y="242" font-family="Arial Black,Arial,sans-serif" font-size="68" font-weight="900" fill="#FFD700" text-anchor="middle" letter-spacing="-1">MATHS</text>

  <!-- Subtitle -->
  <text x="320" y="272" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#a0c4ff" text-anchor="middle" letter-spacing="1">Geometry · Mensuration · Trigonometry</text>

  <!-- Bottom bar -->
  <rect x="0" y="302" width="640" height="58" fill="#2C7873"/>

  <!-- Topic chips -->
  <rect x="20" y="316" width="74" height="22" rx="11" fill="rgba(255,255,255,0.2)"/>
  <text x="57" y="332" font-family="Arial,sans-serif" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">TRIANGLES</text>

  <rect x="102" y="316" width="66" height="22" rx="11" fill="rgba(255,255,255,0.2)"/>
  <text x="135" y="332" font-family="Arial,sans-serif" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">POLYGONS</text>

  <rect x="176" y="316" width="90" height="22" rx="11" fill="rgba(255,255,255,0.2)"/>
  <text x="221" y="332" font-family="Arial,sans-serif" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">MENSURATION</text>

  <rect x="274" y="316" width="100" height="22" rx="11" fill="rgba(255,255,255,0.2)"/>
  <text x="324" y="332" font-family="Arial,sans-serif" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">QUADRILATERAL</text>

  <!-- Video count -->
  <text x="620" y="335" font-family="Arial,sans-serif" font-size="13" font-weight="800" fill="#FFD700" text-anchor="end">5 Videos</text>

  <!-- Exam Rojgaar branding bottom -->
  <text x="320" y="352" font-family="Arial,sans-serif" font-size="10" font-weight="600" fill="rgba(255,255,255,0.55)" text-anchor="middle" letter-spacing="1">EXAM ROJGAAR</text>
</svg>
